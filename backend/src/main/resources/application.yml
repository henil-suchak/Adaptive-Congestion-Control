spring:
  datasource:
    url: jdbc:h2:file:./data/congestion-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis (local dev — falls back gracefully if not running)
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

# JWT Configuration (local dev)
jwt:
  secret: defaultSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000

# Sidecar URLs (local dev — single sidecar)
sidecar:
  urls: http://ns3-sim:8000