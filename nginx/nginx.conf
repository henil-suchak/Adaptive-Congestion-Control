# ── Rate Limiting Zones ─────────────────────────────────────────
# API: 30 requests/second per IP (burst allows short spikes)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Simulation starts: 2 per minute per IP (expensive operation)
limit_req_zone $binary_remote_addr zone=inference:10m rate=2r/m;

server {
    listen 80;
    server_name localhost;

    # ── Serve static React build (production frontend) ──────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy with rate limiting ────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Simulation start (strict rate limit) ────────────────────
    location ~ ^/api/experiments/\d+/start$ {
        limit_req zone=inference burst=3 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket STOMP endpoint (frontend ↔ backend) ───────────
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── WebSocket telemetry ingest (Python sidecar → backend) ───
    location /ws/telemetry-ingest {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
